# Render blueprint for a DEMO-ONLY public instance of Ledger Lens: made-up data from the built-in demo bank, anonymous sessions
# forgotten after two days. Real monobank accounts cannot be connected to a public instance (the app only allows that when it is
# served from the machine itself), so nothing here can touch anyone's bank. It has NOT been deployed from this repository: read
# the first build's log.
#
# Things to know:
#  - HOST must be 0.0.0.0 so Render can reach the service (the app binds to 127.0.0.1 by default).
#  - Render sets RENDER_EXTERNAL_URL to the service's https URL and the app uses it as PUBLIC_URL (cookies, the CSRF origin check).
#  - The free plan sleeps when idle and its disk is ephemeral: the database file is recreated after a restart and every visitor
#    simply starts a fresh demo session.
#  - SESSION_SECRET and TOKEN_ENCRYPTION_KEY are generated by Render, so the app never writes a key file on the instance. The
#    app needs at least 32 characters and 32 bytes in base64; if a key is rejected the startup error says what shape it needs.
services:
  - type: web
    name: ledger-lens-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: SESSION_TTL_DAYS
        value: '2'
      - key: DATABASE_PATH
        value: /tmp/ledger-lens.db
      - key: LOG_LEVEL
        value: info
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
