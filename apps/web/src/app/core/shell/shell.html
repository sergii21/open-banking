<a
  href="#main"
  class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-50 focus:rounded-lg focus:bg-primary focus:px-4 focus:py-2 focus:text-on-primary"
  (click)="$event.preventDefault(); content.focus()"
>
  Skip to main content
</a>

<mat-sidenav-container class="!h-dvh !bg-surface">
  <mat-sidenav
    class="!w-64 !border-r !border-outline-variant !bg-surface-container-low"
    [mode]="desktop() ? 'side' : 'over'"
    [opened]="desktop() || navOpen()"
    (closedStart)="navOpen.set(false)"
    [autoFocus]="false"
    aria-label="Main navigation"
  >
    <div class="flex items-center gap-3 px-5 pt-5 pb-3">
      <span
        class="grid size-10 place-items-center rounded-xl bg-primary text-on-primary"
        aria-hidden="true"
      >
        <mat-icon>lens_blur</mat-icon>
      </span>
      <div>
        <p class="text-lg leading-tight font-semibold tracking-tight">Ledger Lens</p>
        <p class="text-xs text-on-surface-variant">Open Banking demo</p>
      </div>
    </div>
    <mat-nav-list aria-label="Main">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #active="routerLinkActive"
          ariaCurrentWhenActive="page"
          [activated]="active.isActive"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content
    class="flex scroll-pt-28 flex-col"
    [class]="
      inspector.open()
        ? 'pb-[min(50vh,30rem)] scroll-pb-[min(50vh,30rem)] min-[1440px]:pb-0 min-[1440px]:scroll-pb-0 min-[1440px]:pr-[28rem]'
        : ''
    "
  >
    <header
      class="sticky top-0 z-10 flex items-center gap-2 border-b border-outline-variant bg-surface/90 px-3 py-2 backdrop-blur sm:px-5"
    >
      @if (!desktop()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          (click)="navOpen.set(true)"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="font-semibold tracking-tight whitespace-nowrap max-[430px]:hidden"
          >Ledger Lens</span
        >
      }
      <span class="flex-1"></span>
      <span [matTooltip]="modeHint()" tabindex="0" class="rounded-full" data-testid="mode-badge">
        <ll-status-chip [tone]="modeTone()" icon="science">{{ modeLabel() }}</ll-status-chip>
      </span>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="inspectorLabel()"
        [attr.aria-expanded]="inspector.open()"
        aria-controls="inspector"
        [matBadge]="inspector.unseen()"
        [matBadgeHidden]="inspector.unseen() === 0"
        matBadgeSize="small"
        matBadgeColor="primary"
        matTooltip="API Inspector: the real provider calls behind this screen"
        id="inspector-toggle"
        data-testid="inspector-toggle"
        (click)="toggleInspector()"
      >
        <mat-icon>troubleshoot</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="theme.label()"
        [matTooltip]="theme.label()"
        (click)="theme.cycle()"
      >
        <mat-icon>{{ theme.icon() }}</mat-icon>
      </button>
    </header>

    <aside
      id="inspector"
      aria-labelledby="inspector-title"
      class="fixed inset-x-0 bottom-0 z-30 lg:max-[1439px]:left-64 h-[min(50vh,30rem)] rounded-t-3xl border-t border-outline-variant bg-surface shadow-2xl motion-reduce:!transition-none min-[1440px]:inset-y-0 min-[1440px]:right-0 min-[1440px]:left-auto min-[1440px]:h-auto min-[1440px]:w-[28rem] min-[1440px]:rounded-none min-[1440px]:border-t-0 min-[1440px]:border-l"
      [class]="
        inspector.open()
          ? 'visible translate-x-0 translate-y-0 [transition:translate_200ms,visibility_0s]'
          : 'invisible translate-y-full min-[1440px]:translate-y-0 min-[1440px]:translate-x-full [transition:translate_200ms,visibility_0s_linear_200ms]'
      "
    >
      <ll-inspector-panel (closed)="closeInspector()" (keydown.escape)="closeInspector()" />
    </aside>

    <main
      #content
      id="main"
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 outline-none sm:px-6 lg:px-8"
    >
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
